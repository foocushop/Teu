<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <title>CDN Live TV - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white h-screen flex">
    <aside class="w-80 border-r border-neutral-800 p-4 overflow-y-auto" id="liste-chaines">
        <p class="text-blue-500 animate-pulse">Filtrage des flux actifs...</p>
    </aside>
    <main class="flex-1 p-6 flex flex-col">
        <div class="flex-1 bg-neutral-900 rounded-lg overflow-hidden border border-neutral-800 relative">
            <div id="erreur" class="hidden absolute inset-0 bg-black flex flex-col items-center justify-center">
                <p class="text-red-500 font-bold">Flux indisponible</p>
            </div>
            <iframe id="lecteur" class="w-full h-full border-0"></iframe>
        </div>
    </main>

    <script>
        // On récupère la liste déjà filtrée par notre serveur
        async function charger() {
            const res = await fetch('/api/check');
            const data = await res.json();
            const conteneur = document.getElementById('liste-chaines');
            conteneur.innerHTML = '';
            
            data.forEach(c => {
                const btn = document.createElement('div');
                btn.className = "p-3 mb-2 bg-neutral-900 rounded cursor-pointer hover:bg-neutral-800";
                btn.textContent = c.name;
                btn.onclick = () => {
                    document.getElementById('lecteur').src = c.url;
                    document.getElementById('erreur').classList.add('hidden');
                };
                conteneur.appendChild(btn);
            });
        }
        charger();
    </script>
</body>
</html>
