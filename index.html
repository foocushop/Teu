<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex h-screen">
    <aside class="w-80 border-r border-neutral-800 overflow-y-auto" id="menu"></aside>
    <main class="flex-1 flex flex-col p-4">
        <iframe id="lecteur" class="flex-1 w-full bg-neutral-900 border-0"></iframe>
    </main>

    <script>
        async function init() {
            const res = await fetch('/api/channels');
            const data = await res.json();
            const menu = document.getElementById('menu');
            
            data.forEach(c => {
                const div = document.createElement('div');
                div.className = "p-4 border-b border-neutral-800 cursor-pointer hover:bg-blue-900/20";
                div.textContent = c.name;
                div.onclick = () => document.getElementById('lecteur').src = c.url;
                menu.appendChild(div);
            });
        }
        init();
    </script>
</body>
</html>
